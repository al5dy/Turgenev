name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run quality checks
    uses: ./.github/workflows/quality-gate.yml

  quality-gate:
    name: Quality Gate
    needs:
      - checks
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Verify quality gate
        shell: bash
        run: |
          test "${{ needs.checks.result }}" = "success"