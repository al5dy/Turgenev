name: Feature request
description: Suggest an improvement for Turgenev for WordPress
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or workflow you would like the plugin to improve.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples or related information.
