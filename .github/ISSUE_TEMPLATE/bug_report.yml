name: Bug report
description: Report a reproducible problem with Turgenev for WordPress
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough information to reproduce it reliably.

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
      placeholder: "7.1"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.2"
    validations:
      required: true

  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - Gutenberg / Block Editor
        - Classic Editor
        - Both
        - Not editor-related
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe what is happening.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add relevant debug output, console errors, screenshots, or other diagnostics. Remove API keys, credentials and private content.
      render: shell

  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: I confirm this is not a security vulnerability. Security vulnerabilities must be reported privately.
          required: true
